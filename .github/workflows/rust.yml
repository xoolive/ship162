name: Rust

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  feature-check:
    name: Check isolated feature (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [none, rtlsdr, airspy, hackrf, soapy, mqtt, ssh]
    steps:
      - uses: actions/checkout@v7
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsoapysdr-dev libssl-dev pkg-config cmake
      - name: Check each package without feature unification
        env:
          FEATURE: ${{ matrix.feature }}
        run: |
          args=()
          if [ "$FEATURE" != none ]; then
            args+=(--features "$FEATURE")
          fi
          for package in rs162 ship162; do
            cargo check -p "$package" --no-default-features "${args[@]}" --all-targets --locked
          done

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Code linting
        run: cargo clippy --workspace --features "rtlsdr,airspy,hackrf,ssh" --all-targets -- -D warnings

      - name: Code formatting
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --verbose --features "rtlsdr,airspy,hackrf,ssh"

      - name: Run tests
        run: cargo test --workspace --features "rtlsdr,airspy,hackrf,ssh"

      - name: Check docs
        env:
          RUSTDOCFLAGS: "-D rustdoc::all -A rustdoc::private-doc-tests"
        run: cargo doc --features "rtlsdr,airspy,hackrf,ssh" --no-deps
