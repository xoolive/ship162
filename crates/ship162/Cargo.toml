[package]
name = "ship162"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ship162"
path = "src/main.rs"

[dependencies]
rs162 = { path = "../rs162" }
anyhow = "1.0"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.29"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.41"
