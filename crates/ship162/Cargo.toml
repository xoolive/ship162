[package]
name = "ship162"
description = "A real-time AIS data decoder"
repository = "https://github.com/xoolive/ship162"
keywords = ["ship", "maritime", "AIS", "decoding"]
readme = "readme.md"
authors.workspace = true
version.workspace = true
license.workspace = true
edition.workspace = true
homepage.workspace = true

[[bin]]
name = "ship162"
path = "src/main.rs"

[features]
rtlsdr = ['desperado/rtlsdr', 'rs162/rtlsdr']
soapy = ['desperado/soapy', 'rs162/soapy']
mqtt = ["rs162/mqtt"]
ssh = ["rs162/ssh"]

[dependencies]
rs162 = { version = "0.1.3", path = "../rs162" }
anyhow = "1.0"
clap = { version = "4.5.56", features = ["color", "derive", "wrap_help", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
desperado = "0.2.1"
dirs = "6.0.0"
dotenv = "0.15.0"
futures = "0.3"
keepawake = "0.6.0"
ratatui = "0.30"
redis = { version = "1.0.3", features = ["tokio-comp"] }
serde = "1.0.228"
serde_json = "1.0.145"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
toml = "0.9.10"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = "2.5.7"
