[package]
name = "ship162"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ship162"
path = "src/main.rs"

[features]
rtlsdr = ['desperado/rtlsdr', 'rs162/rtlsdr']

[dependencies]
rs162 = { path = "../rs162" }
anyhow = "1.0"
clap = { version = "4.5.51", features = [
    "color",
    "derive",
    "wrap_help",
    "env",
] }
crossterm = { version = "0.29", features = ["event-stream"] }
desperado = { version = "0.1.1", features = ["rtlsdr"] }
dirs = "6.0.0"
dotenv = "0.15.0"
futures = "0.3"
keepawake = "0.6.0"
ratatui = "0.29"
redis = { version = "0.32.7", features = ["tokio-comp"] }
serde = "1.0.228"
serde_json = "1.0.145"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.41"
toml = "0.9.8"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5.7"
