[package]
name = "rs162"
description = "NMEA AIS Message Parser and Decoder with deku-based AIS message structures"
repository = "https://github.com/xoolive/ship162"
keywords = ["ais", "nmea", "maritime", "radio", "decoder"]
categories = ["parsing", "encoding"]
authors.workspace = true
version.workspace = true
license.workspace = true
edition.workspace = true

[features]
mqtt = ["dep:paho-mqtt"]
airspy = ['desperado/airspy']
rtlsdr = ['desperado/rtlsdr']
soapy = ['desperado/soapy']
ssh = ['async-recursion', 'dirs', 'makiko', 'ssh2-config']

[dependencies]
thiserror = "2"
deku = "0.20.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-complex = "0.4"
rtl-sdr-rs = "0.3"
futures = "0.3.32"
tokio = { version = "1", features = ["full"] }
once_cell = "1.21.3"
tracing = "0.1.44"
desperado = "0.3.0"
paho-mqtt = { version = "0.14.0", optional = true }
async-recursion = { version = "1.1.1", optional = true }
dirs = { version = "6.0.0", optional = true }
makiko = { version = "0.2.5", optional = true }
ssh2-config = { version = "0.7.0", optional = true }

[dev-dependencies]
tempfile = "3.26"

[lib]
name = "rs162"
path = "src/lib.rs"
