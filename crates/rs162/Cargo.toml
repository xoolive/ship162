[package]
name = "rs162"
description = "NMEA AIS Message Parser and Decoder with deku-based AIS message structures"
repository = "https://github.com/xoolive/ship162"
keywords = ["ais", "nmea", "maritime", "radio", "decoder"]
categories = ["parsing", "encoding"]
authors.workspace = true
version.workspace = true
license.workspace = true
edition.workspace = true

[features]
rtlsdr = ['desperado/rtlsdr']
mqtt = ["dep:paho-mqtt"]

[dependencies]
thiserror = "2"
deku = "0.20.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-complex = "0.4"
rtl-sdr-rs = "0.2"
futures = "0.3.31"
tokio = { version = "1", features = ["full"] }
once_cell = "1.21.3"
tracing = "0.1.44"
desperado = { version = "0.1.1", features = ["rtlsdr"] }
paho-mqtt = { version = "0.13.3", optional = true }

[dev-dependencies]
tempfile = "3.0"

[lib]
name = "rs162"
path = "src/lib.rs"
