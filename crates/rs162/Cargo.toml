[package]
name = "rs162"
description = "NMEA AIS Message Parser and Decoder with deku-based AIS message structures"
repository = "https://github.com/xoolive/ship162"
keywords = ["ais", "nmea", "maritime", "radio", "decoder"]
categories = ["parsing", "encoding"]
authors.workspace = true
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
thiserror = "2.0.17"
deku = "0.19.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-complex = "0.4"
rtl-sdr-rs = "0.1.0"
futures = "0.3.31"
tokio = { version = "1.48.0", features = ["full"] }
once_cell = "1.21.3"
tracing = "0.1.41"

[dev-dependencies]
tempfile = "3.0"

[lib]
name = "rs162"
path = "src/lib.rs"

[[example]]
name = "iq_file"
path = "examples/iq_file.rs"
# Run with: cargo run --example iq_file -- file.iq [sample_rate] [format]
# Example: cargo run --example iq_file -- samples.iq 48000 cu8
